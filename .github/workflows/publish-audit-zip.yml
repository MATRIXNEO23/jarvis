name: Publish Jarvis timer audio fix ZIP to Download

on:
  push:
    branches: [feature/timer-settings-ui-20261031]
    paths:
      - '.github/workflows/publish-audit-zip.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-full-audit-download-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Package, validate and publish complete Jarvis ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: feature/timer-settings-ui-20261031
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source syntax and offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -s tests -q

      - name: Create and verify complete source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import subprocess
          import zipfile

          archive=Path(os.environ["RUNNER_TEMP"])/"Jarvis-Timer-Audio-Corretto-20261031.zip"
          files=[Path(os.fsdecode(p)) for p in subprocess.check_output(
              ["git","ls-files","-z"]).split(b"\0") if p]
          files=[p for p in files if not (len(p.parts)>1 and p.parts[0]=="Download"
                 and p.suffix.casefold()==".zip")]
          required={
              "jarvis.py", "gpt_client.py", "gpt_bridge.mjs", "workspace_memory.py",
              "telegram_bridge.py", "voice_control.py", "managed_documents.py",
              "prepara_test_telegram50.py", "animated_hud.py", "jarvis_timer.py",
              "hud_reference.py", "hud_raster.py",
              "docs/TIMER_E_IMPOSTAZIONI_20261031.md",
              "avvia_jarvis.bat", "LEGGIMI_PROVA_TELEGRAM_50.txt",
          }
          found={p.as_posix() for p in files}
          assert required.issubset(found), "Missing critical Jarvis components"
          assert "AVVIA_TEST_TELEGRAM50.bat" not in found, "Duplicate launcher"
          assert len(files)>110, "Archive appears incomplete"
          root="Jarvis-Timer-Audio-Corretto-20261031/"
          with zipfile.ZipFile(archive,"w",zipfile.ZIP_DEFLATED,compresslevel=9,
                               allowZip64=True) as z:
              for path in files:
                  if path.is_symlink() or not path.is_file():
                      raise RuntimeError("Non-regular tracked file: "+str(path))
                  entry=zipfile.ZipInfo(root+path.as_posix(),(2026,10,31,0,0,0))
                  entry.compress_type=zipfile.ZIP_DEFLATED
                  entry.external_attr=0o100644 << 16
                  z.writestr(entry,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,
                             compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "Archive CRC failed"
              inside=set(z.namelist())
              assert {root+name for name in required}.issubset(inside)
          print("PUBLISH_ARTIFACT",archive.name)
          print("SOURCE_COMMIT",subprocess.check_output(["git","rev-parse","HEAD"],
                                                       text=True).strip())
          print("FILES",len(files),"ZIP_BYTES",archive.stat().st_size)
          print("SHA256",hashlib.sha256(archive.read_bytes()).hexdigest())
          PY

      - name: Checkout only main's Download folder
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish-main
          persist-credentials: true

      - name: Publish archive and update Download index
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/Jarvis-Timer-Audio-Corretto-20261031.zip" \
             publish-main/Download/Jarvis-Timer-Audio-Corretto-20261031.zip
          python - <<'PY'
          from pathlib import Path
          readme=Path("publish-main/Download/README.md")
          before=readme.read_text(encoding="utf-8")
          heading="# Jarvis: Timer con audio corretto - 31/10/2026"
          section=(
              heading+"\n\n"
              "**[SCARICA JARVIS COMPLETO CON FIX AUDIO TIMER]"
              "(./Jarvis-Timer-Audio-Corretto-20261031.zip)**\n\n"
              "Versione completa per Windows 10 con un solo launcher "
              "`avvia_jarvis.bat`. Il timer e' una finestra indipendente "
              "con cifre digitali, START, PAUSA, STOP, RESET e durata modificabile. "
              "Comandi locali e vocali: 'timer 10 minuti', 'pausa timer', "
              "'riprendi timer', 'stop timer' e 'quanto manca al timer'. "
              "Cinque suonerie offline con anteprima, volume e ripetizione "
              "nelle impostazioni gia' esistenti, ora organizzate per categorie. "
              "**Fix audio:** riproduzione WAV da file con ripiego in memoria, "
              "bip alternativo Windows selezionabile e messaggi di stato visibili "
              "sia nel tasto Prova che alla scadenza del timer. "
              "I comandi originali, Telegram, memoria, progetti, microfono, "
              "add-on e GPT esterno non sono stati rimossi.\n\n"
              "Estrai in una cartella nuova e avvia `avvia_jarvis.bat`. "
              "I dati del profilo di prova restano isolati. I test automatici "
              "Windows/Linux sono superati; il collaudo reale del timer "
              "e dei dispositivi audio sul Pavilion e' ancora necessario. "
              "Sorgente e modifiche nella PR #32.\n\n---\n\n"
          )
          if not before.startswith(heading):
              readme.write_text(section+before,encoding="utf-8")
          PY
          cd publish-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Download/Jarvis-Timer-Audio-Corretto-20261031.zip Download/README.md
          git diff --cached --stat
          git commit -m "Publish complete Jarvis ZIP with fixed timer audio"
          git push origin HEAD:main

      - name: Confirm published ZIP exists in main
        shell: bash
        run: |
          set -euo pipefail
          git -C publish-main fetch origin main
          git -C publish-main ls-tree -r --name-only origin/main -- Download | \
            grep -Fx "Download/Jarvis-Timer-Audio-Corretto-20261031.zip"
