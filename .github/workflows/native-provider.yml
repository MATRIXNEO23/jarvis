name: Native local provider contract (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'local_model/native_provider.py'
      - 'tests/test_native_provider.py'
      - '.github/workflows/native-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native provider
        run: python -m unittest discover -s tests -p test_native_provider.py -v
