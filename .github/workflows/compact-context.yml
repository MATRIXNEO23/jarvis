name: Compact local context (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'local_model/compact_context.py'
      - 'tests/test_compact_context.py'
      - '.github/workflows/compact-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-context:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_compact_context.py -v
