name: Jarvis 014 real Gemma audit and Windows package
on:
  pull_request:
    paths:
      - 'conversation_router.py'
      - 'jarvis.py'
      - 'local_model/**'
      - 'tests/test_native_*.py'
      - 'tools/probe_jarvis014_native.py'
      - 'tools/prepare_build006.py'
      - 'tools/check_build006.py'
      - '.github/workflows/jarvis014-verify.yml'

permissions:
  contents: read

jobs:
  live-gemma:
    if: ${{ github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/jarvis014-native-chat-routing-20261108' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned KoboldCpp DLL
        run: python tools/native_model/restore_engine.py --destination upstream-kobold
      - name: Verify pinned engine SHA
        shell: pwsh
        run: |
          $hash=(Get-FileHash upstream-kobold/koboldcpp_noavx2.dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'Native DLL integrity mismatch' }
      - name: Fetch and verify real Gemma 2 2B IT GGUF
        run: python tools/fetch_probe_gemma.py
      - name: Compare catalog vs informational path with real model
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          JARVIS_TRIAL_HOME: ${{ runner.temp }}/jarvis014-ci-profile
        run: python tools/probe_jarvis014_native.py upstream-kobold probe-model.gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis014-native-proof
          path: |
            jarvis014-live-native-report.json
            probe-model-source.json
          retention-days: 30

  package:
    needs: live-gemma
    if: ${{ github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/jarvis014-native-chat-routing-20261108' }}
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      JARVIS_BUILD_NUMBER: '14'
      JARVIS_EXPECTED_TESTS: '1012'
      JARVIS_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Restore pinned native engine
        run: python tools/native_model/restore_engine.py --destination upstream-kobold
      - name: Verify native engine
        shell: pwsh
        run: |
          $hash=(Get-FileHash upstream-kobold/koboldcpp_noavx2.dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'Native DLL integrity mismatch' }
      - name: Build isolated operational runtime
        run: python tools/build_gemma_clean_trial.py
      - name: Prepare reproducible Jarvis-014.zip with manifest
        run: python tools/prepare_build006.py
      - name: Test extracted ZIP and Windows UI startup/close
        run: python tools/check_build006.py
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis014-windows-candidate
          path: |
            dist/Jarvis-014.zip
            dist/Jarvis-014.json
            dist/Jarvis-014-validation.json
          if-no-files-found: error
          retention-days: 30
