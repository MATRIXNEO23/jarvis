name: Native Gemma settings UI (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'local_model/native_ui.py'
      - 'local_model/native_settings.py'
      - 'tests/test_native_ui.py'
      - 'tests/test_native_settings_entry.py'
      - 'jarvis.py'
      - '.github/workflows/native-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tk settings UI smoke tests
        run: python -m unittest discover -s tests -p test_native_ui.py -v
      - name: Check Jarvis settings entry
        run: python -m unittest discover -s tests -p test_native_settings_entry.py -v
