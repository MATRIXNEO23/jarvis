name: "F5N.2 KoboldCpp pinned native DLL candidate (Windows manual)"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-noavx2:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Jarvis audit tools only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MinGW64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Clone exact upstream and build isolated DLL bundle
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/LostRuins/koboldcpp.git "$RUNNER_TEMP/koboldcpp-src"
          cd "$RUNNER_TEMP/koboldcpp-src"
          git checkout --detach 6d2fedf8624e5f05926af3191f9efdcb13c4133c
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "6d2fedf8624e5f05926af3191f9efdcb13c4133c"
          make -j2 koboldcpp_noavx2 LLAMA_PORTABLE=1 LLAMA_NOAVX2=1
          test -f koboldcpp_common.dll
          test -f koboldcpp_default.dll
          test -f koboldcpp_noavx2.dll
          test -f backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll

      - name: Inventory artifact manifest (no DLL load or GGUF)
        shell: pwsh
        run: |
          python -m tools.f5n_bundle_audit "$env:RUNNER_TEMP/koboldcpp-src" > "$env:RUNNER_TEMP/f5n-dll-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/f5n-dll-manifest.json"

      - name: Archive only unverified research candidate
        uses: actions/upload-artifact@v4
        with:
          name: f5n-unverified-koboldcpp-noavx2-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/koboldcpp-src/koboldcpp_common.dll
            ${{ runner.temp }}/koboldcpp-src/koboldcpp_default.dll
            ${{ runner.temp }}/koboldcpp-src/koboldcpp_noavx2.dll
            ${{ runner.temp }}/koboldcpp-src/backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll
            ${{ runner.temp }}/koboldcpp-src/koboldcpp.py
            ${{ runner.temp }}/f5n-dll-manifest.json
