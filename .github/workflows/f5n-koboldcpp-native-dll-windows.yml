name: "F5N.2 KoboldCpp pinned native DLL candidate (Windows manual)"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/f5n-koboldcpp-native-dll-windows.yml'
      - 'tools/f5n_bundle_audit.py'
      - 'tests/test_f5n_bundle_audit.py'

permissions:
  contents: read

jobs:
  build-upstream-noavx2:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Jarvis audit tools only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MinGW64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Clone exact upstream and build isolated DLL bundle
        shell: msys2 {0}
        run: |
          set -euo pipefail
          trap 'echo "F5N_BUILD_FAIL_LINE=$LINENO EXIT=$?"' ERR
          echo "F5N_STAGE=clone"
          git clone https://github.com/LostRuins/koboldcpp.git koboldcpp-src
          cd koboldcpp-src
          echo "F5N_STAGE=checkout"
          git checkout --detach 6d2fedf8624e5f05926af3191f9efdcb13c4133c
          echo "F5N_STAGE=verify_commit"
          actual_commit="$(git rev-parse HEAD)"
          printf 'F5N_UPSTREAM_COMMIT=%s\\n' "$actual_commit"
          if [ "$actual_commit" != "6d2fedf8624e5f05926af3191f9efdcb13c4133c" ]; then
            echo "F5N_ERROR=unexpected_upstream_commit" >&2
            exit 1
          fi
          echo "F5N_STAGE=submodules"
          git submodule update --init --recursive
          echo "F5N_STAGE=compile"
          # PrefetchVirtualMemory uses Win8+ types; keep Windows 10 compatibility.\n          # Define the Windows SDK baseline without modifying upstream files.\n          export CFLAGS="${CFLAGS:-} -D_WIN32_WINNT=0x0602 -DWINVER=0x0602"\n          export CXXFLAGS="${CXXFLAGS:-} -D_WIN32_WINNT=0x0602 -DWINVER=0x0602"\n          make -j2 koboldcpp_noavx2 LLAMA_PORTABLE=1 LLAMA_NOAVX2=1
          test -f koboldcpp_common.dll
          test -f koboldcpp_default.dll
          test -f koboldcpp_noavx2.dll
          test -f backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll

      - name: Inventory artifact manifest (no DLL load or GGUF)
        shell: pwsh
        run: |
          python -m tools.f5n_bundle_audit "koboldcpp-src" > "f5n-dll-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "f5n-dll-manifest.json"

      - name: Archive only unverified research candidate
        uses: actions/upload-artifact@v4
        with:
          name: f5n-unverified-koboldcpp-noavx2-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            koboldcpp-src/koboldcpp_common.dll
            koboldcpp-src/koboldcpp_default.dll
            koboldcpp-src/koboldcpp_noavx2.dll
            koboldcpp-src/backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll
            koboldcpp-src/koboldcpp.py
            f5n-dll-manifest.json
