name: "F5N.2 KoboldCpp pinned native DLL candidate (Windows manual)"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/f5n-koboldcpp-native-dll-windows.yml'
      - 'tools/f5n_bundle_audit.py'
      - 'tests/test_f5n_bundle_audit.py'
      - 'tools/f5n_pe_abi_audit.py'
      - 'tests/test_f5n_pe_abi_audit.py'
      - 'tools/f5n_native_load_smoke.py'
      - 'tests/test_f5n_native_load_smoke.py'

permissions:
  contents: read

jobs:
  build-upstream-noavx2:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Jarvis audit tools only
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up w64devkit toolchain (same as upstream oldpc release)
        shell: pwsh
        run: |
          # Upstream kcpp-build-release-win-oldpc.yaml at 6d2fedf uses
          # w64devkit 1.22.0. Its GCC links the C++ runtime statically, so the
          # bundle needs no libstdc++/libgcc_s/libwinpthread DLLs on the PC.
          curl -L https://github.com/skeeto/w64devkit/releases/download/v1.22.0/w64devkit-1.22.0.zip --output w64devkit.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive w64devkit.zip -DestinationPath .
          echo "$(Get-Location)\w64devkit\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Clone exact upstream and build isolated DLL bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "F5N_TOOLCHAIN=$((Get-Command gcc).Source)"
          gcc --version | Select-Object -First 1
          git clone https://github.com/LostRuins/koboldcpp.git koboldcpp-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location koboldcpp-src
          git checkout --detach 6d2fedf8624e5f05926af3191f9efdcb13c4133c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git rev-parse HEAD
          Write-Output "F5N_UPSTREAM_COMMIT=$actual"
          if ($actual -ne "6d2fedf8624e5f05926af3191f9efdcb13c4133c") { throw "unexpected_upstream_commit" }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The upstream Makefile resets CFLAGS/CXXFLAGS, so environment flags are lost.
          # Set Win8+ target via compiler command while preserving upstream ISA flags.
          make -j2 koboldcpp_noavx2 LLAMA_PORTABLE=1 LLAMA_NOAVX2=1 "CC=gcc -D_WIN32_WINNT=0x0602 -DWINVER=0x0602" "CXX=g++ -D_WIN32_WINNT=0x0602 -DWINVER=0x0602"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in "koboldcpp_common.dll","koboldcpp_default.dll","koboldcpp_noavx2.dll","backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

      - name: Inventory artifact manifest (no DLL load or GGUF)
        shell: pwsh
        run: |
          python -m tools.f5n_bundle_audit "koboldcpp-src" > "f5n-dll-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "f5n-dll-manifest.json"

      - name: Audit PE exports and internal DLL imports (static, no LoadLibrary)
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.f5n_pe_abi_audit "koboldcpp-src" > "f5n-pe-abi-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "f5n-pe-abi-manifest.json" | Select-Object -First 40

      - name: F5N.4 Windows loader smoke in isolated child (no GGUF)
        shell: pwsh
        timeout-minutes: 3
        run: |
          python -m tools.f5n_native_load_smoke "koboldcpp-src" > "f5n-native-loader-proof.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "f5n-native-loader-proof.json"

      - name: Archive only unverified research candidate
        uses: actions/upload-artifact@v4
        with:
          name: f5n-unverified-koboldcpp-noavx2-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            koboldcpp-src/koboldcpp_common.dll
            koboldcpp-src/koboldcpp_default.dll
            koboldcpp-src/koboldcpp_noavx2.dll
            koboldcpp-src/backend_routes/koboldcpp_noavx2/koboldcpp_backend.dll
            koboldcpp-src/koboldcpp.py
            f5n-dll-manifest.json
            f5n-pe-abi-manifest.json
            f5n-native-loader-proof.json
