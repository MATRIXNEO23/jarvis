name: Publish Jarvis 014 once after verified Windows package
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jarvis014-publish-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish verified immutable build 014
    if: ${{ github.repository == 'MATRIXNEO23/jarvis' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'publish verified Jarvis 014 once') }}
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jarvis014-windows-candidate
          run-id: 42516477567
          github-token: ${{ github.token }}
          repository: MATRIXNEO23/jarvis
          path: ${{ runner.temp }}/verified014
      - name: Validate and register the same-run verified artifact
        shell: python
        env:
          ARTIFACT_HOME: ${{ runner.temp }}/verified014
          VERIFIED_SOURCE: 88c2934cbd6081f94fb33fba5f87f1800b07ebc0
          VERIFIED_RUN: 42516477567
        run: |
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          home=Path(os.environ['ARTIFACT_HOME'])
          archive=home/'Jarvis-014.zip'
          details=json.loads((home/'Jarvis-014.json').read_text(encoding='utf-8'))
          proof=json.loads((home/'Jarvis-014-validation.json').read_text(encoding='utf-8'))
          expected=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert details['build_number']==14 and details['sha256']==expected
          assert details['source_commit']==os.environ['VERIFIED_SOURCE']
          assert details['bytes']==archive.stat().st_size
          assert expected=='f9c9cd92d1443774e48be89674ce04d9897f47d003df0ad11972ab7815d671c0', 'Unexpected verified ZIP hash'
          assert proof['source_commit']==details['source_commit'] and proof['sha256']==expected
          assert proof['full_extracted_runtime_suite']==1013
          for key in ['clean_imports_native_dll','clean_ui_boot_close','injected_tk_callback_exception_rejected','required_guides_and_relative_links','operational_source_parity']:
              assert proof[key] is True, key
          assert proof['overlays_shipped'] is False and proof['runtime_files_copied_from_checkout'] is False
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              version=json.loads(z.read('Jarvis-Gemma/VERSIONE.json'))
              assert version['source_commit']==details['source_commit'] and version['build_number']==14
          registry_path=Path('Download/BUILD-NUMBERS.json')
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          for release in registry['releases']:
              assert hashlib.sha256(Path('Download',release['archive']).read_bytes()).hexdigest()==release['sha256']
          target=Path('Download/Jarvis-014.zip')
          existing=next((r for r in registry['releases'] if r['build_number']==14),None)
          if existing:
              assert existing['sha256']==expected and hashlib.sha256(target.read_bytes()).hexdigest()==expected, 'Build 014 is immutable'
          else:
              assert registry['next_build']==14 and registry['latest_build']==13
              assert hashlib.sha256(Path('Download/Jarvis-013.zip').read_bytes()).hexdigest()=='1926bb5b65d98bb78d1c829cd9143b1e39773c8c14581f6f63a8d0d9454ed781'
              assert not target.exists()
              shutil.copyfile(archive,target)
              run=os.environ['VERIFIED_RUN']
              run_url='https://github.com/MATRIXNEO23/jarvis/actions/runs/'+run
              details.update(windows_workflow_run=run,pc_test='pending')
              Path('Download/Jarvis-014.json').write_text(json.dumps(details,indent=2)+'\n',encoding='utf-8')
              Path('Download/Jarvis-014-validation.json').write_text(json.dumps(proof,indent=2)+'\n',encoding='utf-8')
              registry['releases'].append(dict(build_number=14,label='014',archive=target.name,metadata='Jarvis-014.json',date='2026-11-08',description='Gemma conversazione naturale e routing sicuro con diagnostica stopreason',status='candidate_pc_test_pending',source_commit=details['source_commit'],sha256=expected,bytes=archive.stat().st_size,previous_build=13,git_blob_sha=subprocess.check_output(['git','hash-object',str(target)],text=True).strip()))
              registry.update(latest_build=14,next_build=15)
              registry_path.write_text(json.dumps(registry,indent=2)+'\n',encoding='utf-8')
              url='https://raw.githubusercontent.com/MATRIXNEO23/jarvis/main/Download/Jarvis-014.zip'
              entry='## Build 014 — Gemma: conversazione naturale e comandi protetti\n\n[Scarica Jarvis-014.zip]('+url+')\n\nDomande informative risolte in chat naturale senza catalogo azioni e senza JSON obbligatorio. Il sistema conserva le verifiche rigorose dei comandi e riconosce direttamente sinonimi sicuri di stato sistema. Distinto il raggiungimento di Max Output dai JSON malformati. Suite 1013 test sullo ZIP estratto e prova con GGUF reale su Windows, senza promettere gli stessi tempi sul Pavilion. Estrai in una cartella nuova, conservando 013, progetti, cronologia e profilo. Test microfono e Telegram reali ancora pendenti.\n\n[Verifiche Windows/GGUF]('+run_url+'). SHA-256: `'+expected+'`.\n\n'
              for name in ['Download/README.md','Download/REGISTRO-VERSIONI.md']:
                  p=Path(name)
                  p.write_text(entry+p.read_text(encoding='utf-8'),encoding='utf-8')
              p=Path('README.md')
              p.write_text('**Nuova candidata Windows: [Jarvis 014]('+url+')** — verificata su Windows, collaudo PC pendente.\n\n'+p.read_text(encoding='utf-8'),encoding='utf-8')
              Path('docs/PUBBLICAZIONE-014.md').write_text(entry,encoding='utf-8')
      - name: Publish verified files on main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Download README.md docs/PUBBLICAZIONE-014.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Publish verified immutable Jarvis build 014'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Publication failed; no force push' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Diff failed' }

      - name: Verify public download and immutable previous build
        shell: python
        run: |
          import hashlib,json,time,urllib.request
          prefix='https://raw.githubusercontent.com/MATRIXNEO23/jarvis/main/'
          expected='f9c9cd92d1443774e48be89674ce04d9897f47d003df0ad11972ab7815d671c0'
          old='1926bb5b65d98bb78d1c829cd9143b1e39773c8c14581f6f63a8d0d9454ed781'
          def get(path):
              with urllib.request.urlopen(prefix+path,timeout=30) as response:
                  return response.read()
          for attempt in range(7):
              try:
                  archive=get('Download/Jarvis-014.zip?verify=88c2934cbd6081f94fb33fba5f87f1800b07ebc0')
                  assert hashlib.sha256(archive).hexdigest()==expected
                  before=get('Download/Jarvis-013.zip?verify=88c2934cbd6081f94fb33fba5f87f1800b07ebc0')
                  assert hashlib.sha256(before).hexdigest()==old
                  registry=json.loads(get('Download/BUILD-NUMBERS.json?verify=88c2934cbd6081f94fb33fba5f87f1800b07ebc0'))
                  assert registry['latest_build']==14 and registry['next_build']==15
                  meta=json.loads(get('Download/Jarvis-014.json?verify=88c2934cbd6081f94fb33fba5f87f1800b07ebc0'))
                  assert meta['sha256']==expected and meta['source_commit']=='88c2934cbd6081f94fb33fba5f87f1800b07ebc0'
                  index=get('Download/README.md?verify=88c2934cbd6081f94fb33fba5f87f1800b07ebc0').decode('utf-8')
                  assert index.startswith('## Build 014') and 'Jarvis-013.zip' in index
                  break
              except Exception:
                  if attempt==6: raise
                  time.sleep(4)
          print('JARVIS014_REMOTE_VERIFIED=https://raw.githubusercontent.com/MATRIXNEO23/jarvis/main/Download/Jarvis-014.zip')
