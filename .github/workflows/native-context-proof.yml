name: Native context tokenizer proof (Windows)
on:
  pull_request:
    paths: ['tools/probe_native_context*.py','tests/test_native_prompt_policy.py','local_model/*.py','.github/workflows/native-context-proof.yml']
permissions:
  contents: read
  actions: read
jobs:
  native-gemma:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prompt policy regressions (captured ABI and real Tk)
        run: python -m unittest discover -s tests -p test_native_prompt_policy.py -v
      - name: Restore pinned native engine
        run: python tools/native_model/restore_engine.py --destination upstream-kobold
      - name: Verify native DLL provenance
        shell: pwsh
        run: |
          $hash=(Get-FileHash upstream-kobold/koboldcpp_noavx2.dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'DLL integrity mismatch' }
      - name: Fetch public CI model and verify publisher SHA256
        run: python tools/fetch_probe_gemma.py
      - name: Native Gemma generation (no launcher or server)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools/probe_native_context_tokens.py upstream-kobold probe-model.gguf
      - name: Jarvis native context owner integration
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools/probe_native_context_integration.py upstream-kobold probe-model.gguf
      - uses: actions/upload-artifact@v4
        with:
          name: native-context-token-proof
          path: |
            native-context-tokens-report.json
            native-context-integration-report.json
            probe-model-source.json
          retention-days: 14
