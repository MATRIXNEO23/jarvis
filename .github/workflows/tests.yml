name: Jarvis unit and GPT protocol checks

on:
  workflow_dispatch:
    inputs:
      build_candidate:
        description: 'Build e pubblicazione candidato: usare solo dopo richiesta esplicita dell’utente'
        required: true
        type: boolean
        default: false
  push:
    branches: [main, 'feature/file-access-20261101', 'feature/fix-file-search-20261102', 'feature/program-apps-20261103']
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Python and Node checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Python syntax
        run: python -m compileall -q .
      - name: GPT JavaScript syntax
        run: node --check gpt_bridge.mjs
      - name: Unit tests (no external login)
        run: python -m unittest discover -s tests -v
      - name: PowerShell setup syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('installa_gpt.ps1','program_apps/windows_apps.ps1')) {
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Host
            exit 1
          }
          }

      - name: Native Windows file access probe
        run: python tools/probe_file_access_windows.py
      - name: Windows Search service observation (CI only)
        shell: powershell
        run: |
          $service = Get-Service WSearch -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            $service | Format-List Name,Status,StartType
          } else {
            Write-Host 'WSearch not installed in runner: index retrieval remains unverified; fallback must pass.'
          }

      - name: Live Windows Search integration (isolated CI only)
        # Independent native evidence remains useful when a unit regression
        # has intentionally reproduced a different application defect.
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        timeout-minutes: 5
        run: python tools/probe_windows_search_live.py --ci-only

      - name: Build operational candidate (Windows only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_candidate && matrix.python-version == '3.12'
        run: python tools/build_file_access.py dist
      - name: Verify extracted candidate on Windows
        if: github.event_name == 'workflow_dispatch' && inputs.build_candidate && matrix.python-version == '3.12'
        run: python tools/check_file_access_package.py dist/Jarvis-003.zip
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_candidate && matrix.python-version == '3.12'
        with:
          name: Jarvis-003
          path: dist/*
          retention-days: 30

  publish-file-access:
    name: Publish immutable numbered candidate 003 (Windows)
    needs: unit
    if: ${{ false }} # Build003 delivered; one-time publisher disabled.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-003
          path: ${{ runner.temp }}/numbered-candidate
      - name: Verify and register immutable build 003
        shell: python
        env:
          CANDIDATE_HOME: ${{ runner.temp }}/numbered-candidate
          VERIFIED_SOURCE: ${{ github.sha }}
          VERIFIED_RUN: ${{ github.run_id }}
        run: |
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          number=3
          label=f'{number:03d}'
          name=f'Jarvis-{label}.zip'
          home=Path(os.environ['CANDIDATE_HOME'])
          details=json.loads((home/f'Jarvis-{label}.json').read_text(encoding='utf-8'))
          sha=os.environ['VERIFIED_SOURCE']
          archive=home/name
          assert details['source_commit']==sha and details['build_number']==number
          assert details['archive']==name and details['build_label']==label
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==details['sha256']
          assert archive.stat().st_size==details['bytes']
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              version=json.loads(z.read(f'Jarvis-{label}/VERSIONE.json'))
              assert version['build_number']==number and version['source_commit']==sha
          registry_path=Path('Download/BUILD-NUMBERS.json')
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          previous=next(r for r in registry['releases'] if r['build_number']==number-1)
          assert hashlib.sha256(Path('Download',previous['archive']).read_bytes()).hexdigest()==previous['sha256']
          existing=next((r for r in registry['releases'] if r['build_number']==number),None)
          if existing is None:
              assert registry['next_build']==number and registry['latest_build']==number-1
          else:
              assert registry['latest_build']==number and registry['next_build']==number+1, 'Stale release retry must not repoint latest links'
              assert existing['source_commit']==sha and existing['sha256']==details['sha256']
          target=Path('Download')/name
          if target.exists():
              assert target.read_bytes()==archive.read_bytes(), 'Published numbered builds are immutable'
          else:
              shutil.copyfile(archive,target)
          details.update(windows_workflow_run=os.environ['VERIFIED_RUN'],pc_test='pending')
          metadata_path=Path('Download',f'Jarvis-{label}.json')
          if metadata_path.exists():
              old=json.loads(metadata_path.read_text(encoding='utf-8'))
              assert old['source_commit']==sha and old['sha256']==details['sha256']
          metadata_path.write_text(json.dumps(details,indent=2)+'\n',encoding='utf-8')
          if existing is None:
              registry['releases'].append(dict(build_number=number,label=label,archive=name,
                  metadata=metadata_path.name,date='2026-11-03',
                  description='Interruttori rapidi MIC, GPT e MEMORIA',
                  status='candidate_pc_test_pending',source_commit=sha,
                  sha256=details['sha256'],bytes=details['bytes'],previous_build=number-1,
                  git_blob_sha=subprocess.check_output(['git','hash-object',str(target)],text=True).strip()))
              registry.update(latest_build=number,next_build=number+1)
              registry_path.write_text(json.dumps(registry,indent=2)+'\n',encoding='utf-8')
          url='https://raw.githubusercontent.com/MATRIXNEO23/jarvis/main/Download/'+name
          page=Path('Download/README.md')
          text=page.read_text(encoding='utf-8')
          first_end=text.find('\n')
          text=(f'> **Recupero e versioni:** [registro](REGISTRO-VERSIONI.md). Ultima candidata **{label}**, verificata su Windows; collaudo PC pendente. Build001/002 e base PC b936879 conservate.'+text[first_end:])
          title=f'## Build {label} — Interruttori rapidi'
          entry=(title+'\n\n'+f'[Scarica {name}]({url})\n\n'
              'MIC, GPT e MEMORIA in alto a destra sono ora cliccabili e sincronizzati con le impostazioni. '
              'Estrai in una cartella nuova e avvia avvia_jarvis.bat; profilo di prova e impostazioni esistenti conservati. '
              'Test Windows, pacchetto estratto e avvio/chiusura UI verificati; GPT/account/microfono/Pavilion da collaudare. '
              'Limite20 risultati e altri rilievi ancora aperti; nessuna nuova capacità di apertura file.\n\n'
              f'Sorgenti: [{sha[:7]}](https://github.com/MATRIXNEO23/jarvis/tree/{sha}). '
              f'[Prove Windows](https://github.com/MATRIXNEO23/jarvis/actions/runs/{os.environ["VERIFIED_RUN"]}). '
              f'SHA-256: `{details["sha256"]}`.\n\n')
          if title not in text:
              split=text.find('\n')+1
              text=text[:split]+'\n'+entry+text[split:]
          page.write_text(text,encoding='utf-8')
          root=Path('README.md')
          lines=root.read_text(encoding='utf-8').splitlines()
          link=(f'**Nuova build candidata Windows: [Jarvis {label}]({url})** — interruttori rapidi MIC, GPT e MEMORIA; collaudo PC pendente. [Versioni precedenti](Download/REGISTRO-VERSIONI.md).')
          found=next((i for i,line in enumerate(lines) if line.startswith('**Nuova build candidata Windows:')),None)
          if found is None:
              lines.insert(0,link)
          else:
              lines[found]=link
          root.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          history=Path('Download/REGISTRO-VERSIONI.md')
          text=history.read_text(encoding='utf-8')
          row=f'| {label} | [{name}]({url}) | Candidata, collaudo PC pendente | Interruttori rapidi MIC, GPT e MEMORIA |'
          if row not in text:
              marker='\n| 002 |'
              assert marker in text
              text=text.replace(marker,'\n'+row+marker,1)
          text=text.replace('la prossima sarà003.','la prossima sarà004.')
          history.write_text(text,encoding='utf-8')
          print('PERSISTENT_CANDIDATE='+json.dumps(details))
      - name: Publish Download and links without changing application sources on main
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Download README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish immutable Jarvis build 003"
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Publication failed; inspect main without force push' }
          }
      - name: Verify public build 003 and preserved builds 001/002
        shell: python
        env:
          VERIFIED_SOURCE: ${{ github.sha }}
        run: |
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          sha=os.environ['VERIFIED_SOURCE']
          name='Jarvis-003.zip'
          details=json.loads(Path('Download/Jarvis-003.json').read_text(encoding='utf-8'))
          registry=json.loads(Path('Download/BUILD-NUMBERS.json').read_text(encoding='utf-8'))
          previous=[r for r in registry['releases'] if r['build_number']<3]
          prefix='https://raw.githubusercontent.com/MATRIXNEO23/jarvis/main/'
          def get(path):
              with urllib.request.urlopen(prefix+path,timeout=25) as response:
                  return response.read()
          for attempt in range(4):
              try:
                  data=get('Download/'+name)
                  assert len(data)==details['bytes'] and hashlib.sha256(data).hexdigest()==details['sha256']
                  text=get('Download/README.md?verify='+sha).decode('utf-8')
                  assert text.index(name)<text.index('## Build 002')
                  assert name in get('README.md?verify='+sha).decode('utf-8')[:2000]
                  public_registry=json.loads(get('Download/BUILD-NUMBERS.json?verify='+sha))
                  assert public_registry['latest_build']==3 and public_registry['next_build']==4
                  for release in previous:
                      old=get('Download/'+release['archive'])
                      assert hashlib.sha256(old).hexdigest()==release['sha256']
                  break
              except Exception:
                  if attempt==3:
                      raise
                  time.sleep(3)
          print('PUBLISHED_DOWNLOAD_VERIFIED='+json.dumps(dict(archive=name,url=prefix+'Download/'+name,
              source_commit=sha,sha256=details['sha256'],bytes=len(data),build_number=3,previous_build_preserved=True)))
