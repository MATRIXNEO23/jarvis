name: Jarvis unit and GPT protocol checks

on:
  push:
    branches: [main, 'feature/file-access-20261101']
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.mjs'
      - '**.ps1'
      - '**.bat'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Python and Node checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Python syntax
        run: python -m compileall -q .
      - name: GPT JavaScript syntax
        run: node --check gpt_bridge.mjs
      - name: Unit tests (no external login)
        run: python -m unittest discover -s tests -v
      - name: PowerShell setup syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'installa_gpt.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Host
            exit 1
          }

      - name: Native Windows file access probe
        run: python tools/probe_file_access_windows.py
      - name: Windows Search service observation (CI only)
        shell: powershell
        run: |
          $service = Get-Service WSearch -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            $service | Format-List Name,Status,StartType
          } else {
            Write-Host 'WSearch not installed in runner: index retrieval remains unverified; fallback must pass.'
          }

      - name: Build operational candidate (Windows only)
        if: matrix.python-version == '3.12'
        run: python tools/build_file_access.py dist
      - name: Verify extracted candidate on Windows
        if: matrix.python-version == '3.12'
        run: python tools/check_file_access_package.py dist/Jarvis-Accesso-File-0.1.0-20261101.zip
      - uses: actions/upload-artifact@v4
        if: success() && matrix.python-version == '3.12'
        with:
          name: Jarvis-Accesso-File-0.1.0-20261101
          path: dist/*
          retention-days: 30
