name: Jarvis local engine tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Python tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
