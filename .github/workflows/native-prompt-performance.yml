name: Native prompt performance audit (Windows)
on:
  pull_request:
    paths: ['tools/probe_native_prompt_performance.py', '.github/workflows/native-prompt-performance.yml']
permissions:
  contents: read
jobs:
  native-performance:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned native engine
        run: python tools/native_model/restore_engine.py --destination upstream-kobold
      - name: Verify pinned DLL
        shell: pwsh
        run: |
          $hash=(Get-FileHash upstream-kobold/koboldcpp_noavx2.dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'DLL integrity mismatch' }
      - name: Fetch verified public Gemma 2 2B IT Q4_K_M
        run: python tools/fetch_probe_gemma.py
      - name: Audit unmodified native conversation route
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          JARVIS_TRIAL_HOME: ${{ runner.temp }}/jarvis-native-performance
        run: python tools/probe_native_prompt_performance.py upstream-kobold probe-model.gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-prompt-performance
          path: |
            native-prompt-performance-report.json
            probe-model-source.json
          retention-days: 14
