name: Jarvis Gemma clean Windows trial
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned native engine
        run: python tools/native_model/restore_engine.py --destination upstream-kobold
      - name: Verify native engine
        shell: pwsh
        run: |
          $dll='upstream-kobold/koboldcpp_noavx2.dll'
          if (!(Test-Path $dll)) { throw 'Native DLL missing' }
          $hash=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'Native DLL SHA mismatch' }
      - name: Build and validate clean ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verifiedScripts = @(git ls-files -- '*.py' '*.mjs' '*.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate verified scripts' }
          $scriptHashes = @{}
          foreach ($script in $verifiedScripts) {
            $scriptHashes[$script] = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash
          }
          python tools/build_gemma_clean_trial.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          foreach ($script in $verifiedScripts) {
            $after = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash
            if ($after -ne $scriptHashes[$script]) { throw "Build changed verified script: $script" }
          }
          python -m py_compile local_model/native_factory.py local_model/native_ui.py jarvis.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Python syntax failed' }
          python -m unittest discover -s tests -p test_native_conversation_session.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Gemma tests failed' }
      - name: Prepare numbered candidate 006 without changing runtime scripts
        run: python tools/prepare_build006.py
      - name: Verify actual extracted candidate 006 on Windows
        run: python tools/check_build006.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-006
          path: dist/*
          retention-days: 30
          if-no-files-found: error
