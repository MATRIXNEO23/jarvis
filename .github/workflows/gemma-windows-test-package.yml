name: Jarvis Gemma clean Windows trial
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Jarvis unit and GPT protocol checks']
    types: [completed]
    branches: ['feature/gemma-local-20261104']
permissions:
  contents: write
  actions: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/gemma-local-20261104')
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/download-artifact@v4
        with:
          name: native-engine-proof-not-installable
          run-id: 41860087656
          github-token: ${{ github.token }}
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native engine
        shell: pwsh
        run: |
          $dll='upstream-kobold/koboldcpp_noavx2.dll'
          if (!(Test-Path $dll)) { throw 'Native DLL missing' }
          $hash=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'Native DLL SHA mismatch' }
      - name: Build and validate clean ZIP
        shell: pwsh
        run: |
          python tools/build_gemma_clean_trial.py
          python -m py_compile local_model/native_factory.py local_model/native_ui.py jarvis.py
          python -m unittest discover -s tests -p test_native_conversation_session.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Gemma-PROVA-CORRETTA
          path: Jarvis-Gemma-PROVA-CORRETTA.zip
          retention-days: 14
          if-no-files-found: error
      - name: Publish ZIP to main Download
        shell: pwsh
        run: |
          git clone --depth 1 --branch main https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git publish-main
          New-Item -ItemType Directory -Force -Path publish-main/Download | Out-Null
          Copy-Item Jarvis-Gemma-PROVA-CORRETTA.zip publish-main/Download/Jarvis-Gemma-PROVA-CORRETTA.zip
          git -C publish-main config user.name 'github-actions[bot]'
          git -C publish-main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish-main add Download/Jarvis-Gemma-PROVA-CORRETTA.zip
          git -C publish-main commit -m 'Publish clean Gemma Windows trial build'
          git -C publish-main push origin HEAD:main
