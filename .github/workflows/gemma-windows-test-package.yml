name: Jarvis Gemma clean Windows trial
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LostRuins/koboldcpp
          ref: 7e0eb2dc4a23f1a0fc42a7660ad43be7a4b9e759
          path: upstream-kobold
      - uses: actions/download-artifact@v4
        with:
          name: native-engine-proof-not-installable
          run-id: 41860087656
          github-token: ${{ github.token }}
          path: upstream-kobold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native engine
        shell: pwsh
        run: |
          $dll='upstream-kobold/koboldcpp_noavx2.dll'
          if (!(Test-Path $dll)) { throw 'Native DLL missing' }
          $hash=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ac834f409855bd7e12a0f0c0ffc8601a663b036b2403d74af4b6b3d3afd49bba') { throw 'Native DLL SHA mismatch' }
      - name: Build and validate clean ZIP
        shell: pwsh
        run: |
          python tools/build_gemma_clean_trial.py
          python -m py_compile local_model/native_factory.py local_model/native_ui.py jarvis.py
          python -m unittest discover -s tests -p test_native_conversation_session.py -v
      - name: Verify the extracted Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'jarvis-gemma-extracted'
          Expand-Archive Jarvis-Gemma-PROVA-CORRETTA.zip -DestinationPath $target
          Copy-Item tests (Join-Path $target 'Jarvis-Gemma/tests') -Recurse
          Push-Location (Join-Path $target 'Jarvis-Gemma')
          try {
            python -m compileall -q jarvis.py local_model program_apps
            if ($LASTEXITCODE -ne 0) { throw 'Extracted Python syntax failed' }
            python -m unittest discover -s tests -p test_program_apps_service.py -v
            if ($LASTEXITCODE -ne 0) { throw 'Extracted app command tests failed' }
            python -m unittest discover -s tests -p test_native_conversation_session.py -v
            if ($LASTEXITCODE -ne 0) { throw 'Extracted Gemma tests failed' }
            python -c "import ctypes; ctypes.WinDLL(r'native_engine/koboldcpp_noavx2.dll')"
            if ($LASTEXITCODE -ne 0) { throw 'Extracted native DLL failed to load' }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Gemma-PROVA-CORRETTA
          path: Jarvis-Gemma-PROVA-CORRETTA.zip
          retention-days: 14
          if-no-files-found: error
