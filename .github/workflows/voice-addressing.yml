name: Voice addressing regression (Windows only)
on:
  push:
    branches: ['fix/gpt-voice-addressing-20261103']
    paths: ['tests/test_gpt_voice_addressing.py', '.github/workflows/voice-addressing.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_gpt_voice_addressing.py -v
