name: Memory preferences (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'jarvis.py'
      - 'local_model/memory_preferences.py'
      - 'local_model/memory_ui.py'
      - 'tests/test_memory_preferences.py'
      - '.github/workflows/memory-preferences.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-preferences:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile jarvis.py local_model/memory_ui.py
      - run: python -m unittest discover -s tests -p test_memory_preferences.py -v
