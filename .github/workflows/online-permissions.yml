name: Per-feature GPT permissions (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'local_model/online_permissions.py'
      - 'local_model/chat_transport.py'
      - 'local_model/online_permissions_ui.py'
      - 'jarvis.py'
      - 'tests/test_online_permissions.py'
      - '.github/workflows/online-permissions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Jarvis and permissions editor
        run: python -m py_compile jarvis.py local_model/online_permissions_ui.py
      - name: Test offline-first GPT authorization
        run: python -m unittest discover -s tests -p test_online_permissions.py -v
