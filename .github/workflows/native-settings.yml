name: Native Gemma settings (Windows)
on:
  push:
    branches: ['feature/gemma-local-20261104']
    paths:
      - 'local_model/native_config.py'
      - 'local_model/native_settings.py'
      - 'tests/test_native_settings.py'
      - '.github/workflows/native-settings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify editable settings and isolation
        run: python -m unittest discover -s tests -p test_native_settings.py -v
